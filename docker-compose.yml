services:
  core-api:
    build:
      context: ./services/core-api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - SECRET_KEY
      - JWT_EXPIRES_IN_SECONDS
      - LOG_LEVEL
      - CREDENTIALS
      - CORS_ORIGINS
      - DATABASE_URL
      - SUPER_ADMIN_EMAIL
      - SUPER_ADMIN_PASSWORD
      - SUPER_ADMIN_NAME
      - SUPER_ADMIN_COMPANY_NAME
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - S3_BUCKET_NAME
      # Not consumed by any code yet (the AI technical round isn't built), reserved
      # ahead of time, see secrets-vault's vault.env.template.
      - GROQ_API_KEY
      # Grading a dsa submission's test cases calls judge-service server-to-server
      # (not through the browser). Same compose network, so the service name
      # resolves directly, no host.docker.internal needed here.
      - JUDGE_SERVICE_URL=http://judge-service:4001
    volumes:
      - ./services/core-api/src:/app/src
      - ./services/core-api/prisma:/app/prisma
    depends_on:
      - judge-service

  judge-service:
    build:
      context: ./services/judge-service
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=development
      - PORT=4001
      - CORS_ORIGINS=http://localhost:3000
      # Judge0 itself isn't part of this compose file, it runs as its own
      # separate stack directly on the host. host.docker.internal reaches it
      # from inside this container. See judge-service's README.
      - JUDGE0_URL=http://host.docker.internal:2358
    volumes:
      - ./services/judge-service/src:/app/src

  web-frontend:
    build:
      context: ./services/web-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
      - NEXT_PUBLIC_JUDGE_URL=http://localhost:4001
    volumes:
      - ./services/web-frontend/src:/app/src
    depends_on:
      - core-api
      - judge-service
